<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UQPA</title>
  <meta name="description" content="UQPA — new website coming soon.">
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #51247a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #f2f2f2;
        --muted: #a0a0a0;
        --accent: #b48ce0;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      text-align: center;
    }
    main { max-width: 32rem; }
    h1 {
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    p { margin-top: 0.75rem; color: var(--muted); font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <h1>UQPA</h1>
    <p>Our new website is coming soon.</p>
  </main>
</body>
</html>
